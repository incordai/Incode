[package]
name = "incord-sandbox"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Run any command - an agent CLI, a test suite, a tool call - under one policy file: filesystem, network, environment and resource limits"
repository = "https://github.com/incordai/Incode"
keywords = ["sandbox", "landlock", "seatbelt", "agents", "security"]
categories = ["command-line-utilities", "os"]

[lib]
name = "incord_sandbox"
path = "src/lib.rs"

[[bin]]
name = "sbx"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The native Windows sandbox (`src/windows`): a write-restricted token, an
# ACE per writable root, and a job object. The same version and features incode
# itself already resolves (windows-sys 0.61.2 is in Cargo.lock), so nothing new
# is downloaded or linked.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "=0.4.7"

[dev-dependencies]
tempfile = "3"
