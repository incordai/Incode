[package]
name = "incord-sandbox"
# Released beside incode, under the same tag: kept equal to its version.
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Run any command - an agent CLI, a test suite, a tool call - under one policy file: filesystem, network, environment and resource limits"
repository = "https://github.com/incordai/Incode"
keywords = ["sandbox", "landlock", "seatbelt", "agents", "security"]
categories = ["command-line-utilities", "os"]

[lib]
name = "incord_sandbox"
path = "src/lib.rs"

[[bin]]
name = "sbx"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The native Windows sandbox (`src/windows`): a write-restricted token, an
# ACE per writable root, and a job object; and for network deny (layer 2,
# `sbx setup-windows`) a local account, DPAPI for its password and Windows
# Filtering Platform filters. The same windows-sys incode itself already
# resolves (0.61.2 is in Cargo.lock), so nothing new is downloaded; the extra
# features only add bindings.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_NetManagement",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Rpc",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "=0.4.7"

[dev-dependencies]
tempfile = "3"
